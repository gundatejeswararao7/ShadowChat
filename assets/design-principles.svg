<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a371f7"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f0883e"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f85149"/></marker><marker id="m-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/></marker><marker id="m-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f778ba"/></marker><marker id="m-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e3b341"/></marker><marker id="m-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs><rect width="1200" height="620" rx="20" fill="#0d1117" stroke="#30363d"/><text x="600.0" y="46" font-size="26" fill="#e6edf3" font-weight="800" text-anchor="middle">Design Principles</text><text x="600.0" y="72" font-size="14" fill="#8b949e" font-weight="400" text-anchor="middle">Privacy first, by design</text><rect x="450" y="90" width="300" height="64" rx="14" fill="#161b22" stroke="#a371f7" stroke-width="2"/><text x="600.0" y="128.0" font-size="20" fill="#e6edf3" font-weight="700" text-anchor="middle">Privacy First</text><path d="M600,156 V200 H260 V218" fill="none" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><line x1="600" y1="156" x2="600" y2="216" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><path d="M600,200 H940 V218" fill="none" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><rect x="140" y="220" width="240" height="82" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="260.0" y="254.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Minimal data</text><text x="260.0" y="277.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">chat is not stored</text><rect x="480" y="220" width="240" height="82" rx="14" fill="#161b22" stroke="#2dd4bf" stroke-width="2"/><text x="600.0" y="254.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Temporary rooms</text><text x="600.0" y="277.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">keys die with the room</text><rect x="820" y="220" width="240" height="82" rx="14" fill="#161b22" stroke="#f85149" stroke-width="2"/><text x="940.0" y="254.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Encryption</text><text x="940.0" y="277.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">AES-256-GCM</text><path d="M260,304 V336 H600" fill="none" stroke="#8b949e" stroke-width="2.5"/><path d="M940,304 V336 H600" fill="none" stroke="#8b949e" stroke-width="2.5"/><line x1="600" y1="304" x2="600" y2="366" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><rect x="430" y="368" width="340" height="64" rx="14" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="600.0" y="405.4" font-size="18" fill="#e6edf3" font-weight="700" text-anchor="middle">Temporary communication</text><rect x="30" y="480" width="270" height="96" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="165.0" y="521.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Minimal persistence</text><text x="165.0" y="544.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">no permanent chat history</text><rect x="320" y="480" width="270" height="96" rx="14" fill="#161b22" stroke="#2dd4bf" stroke-width="2"/><text x="455.0" y="521.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Temporary resources</text><text x="455.0" y="544.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">rooms and keys live only for the chat</text><rect x="610" y="480" width="270" height="96" rx="14" fill="#161b22" stroke="#f778ba" stroke-width="2"/><text x="745.0" y="521.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Restricted rooms</text><text x="745.0" y="544.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">exactly two participants</text><rect x="900" y="480" width="270" height="96" rx="14" fill="#161b22" stroke="#a371f7" stroke-width="2"/><text x="1035.0" y="521.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Server-side enforcement</text><text x="1035.0" y="544.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">rules enforced by the server</text></svg>