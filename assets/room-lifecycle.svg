<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a371f7"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f0883e"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f85149"/></marker><marker id="m-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/></marker><marker id="m-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f778ba"/></marker><marker id="m-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e3b341"/></marker><marker id="m-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs><rect width="1200" height="700" rx="20" fill="#0d1117" stroke="#30363d"/><text x="600.0" y="46" font-size="26" fill="#e6edf3" font-weight="800" text-anchor="middle">Room Lifecycle</text><text x="600.0" y="72" font-size="14" fill="#8b949e" font-weight="400" text-anchor="middle">Created by an accepted invitation, destroyed with its key</text><rect x="45" y="100" width="180" height="80" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="135.0" y="133.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Invitation sent</text><text x="135.0" y="156.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">to a registered user</text><circle cx="45" cy="100" r="13" fill="#58a6ff"/><text x="45" y="105" font-size="13" fill="#0d1117" font-weight="800" text-anchor="middle">1</text><rect x="275" y="100" width="180" height="80" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="365.0" y="133.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Recipient decides</text><text x="365.0" y="156.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">YES / NO / timeout</text><circle cx="275" cy="100" r="13" fill="#f0883e"/><text x="275" y="105" font-size="13" fill="#0d1117" font-weight="800" text-anchor="middle">2</text><rect x="505" y="100" width="180" height="80" rx="14" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="595.0" y="133.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Accepted</text><text x="595.0" y="156.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">invitation = YES</text><circle cx="505" cy="100" r="13" fill="#3fb950"/><text x="505" y="105" font-size="13" fill="#0d1117" font-weight="800" text-anchor="middle">3</text><rect x="735" y="100" width="180" height="80" rx="14" fill="#161b22" stroke="#a371f7" stroke-width="2"/><text x="825.0" y="133.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Room created</text><text x="825.0" y="156.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">exactly two users</text><circle cx="735" cy="100" r="13" fill="#a371f7"/><text x="735" y="105" font-size="13" fill="#0d1117" font-weight="800" text-anchor="middle">4</text><rect x="965" y="100" width="180" height="80" rx="14" fill="#161b22" stroke="#e3b341" stroke-width="2"/><text x="1055.0" y="133.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Fresh room key</text><text x="1055.0" y="156.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">256-bit AES key</text><circle cx="965" cy="100" r="13" fill="#e3b341"/><text x="965" y="105" font-size="13" fill="#0d1117" font-weight="800" text-anchor="middle">5</text><line x1="228" y1="140.0" x2="272" y2="140.0" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><line x1="458" y1="140.0" x2="502" y2="140.0" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><line x1="688" y1="140.0" x2="732" y2="140.0" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><line x1="918" y1="140.0" x2="962" y2="140.0" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><line x1="365" y1="182" x2="365" y2="203" stroke="#f85149" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#m-red)"/><rect x="290" y="205" width="150" height="24" rx="12.0" fill="#f85149" fill-opacity="0.14" stroke="#f85149"/><text x="365.0" y="221.55" font-size="13" fill="#f85149" font-weight="600" text-anchor="middle">NO: rejected</text><rect x="290" y="235" width="150" height="24" rx="12.0" fill="#f85149" fill-opacity="0.14" stroke="#f85149"/><text x="365.0" y="251.55" font-size="13" fill="#f85149" font-weight="600" text-anchor="middle">timeout: expired</text><path d="M1055.0,180 V272 H135.0 V327" fill="none" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><rect x="45" y="330" width="180" height="80" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="135.0" y="363.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Users connect</text><text x="135.0" y="386.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">WebSocket + auth</text><rect x="275" y="330" width="180" height="80" rx="14" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="365.0" y="363.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Encrypted chat</text><text x="365.0" y="386.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">AES-256-GCM</text><line x1="228" y1="370" x2="272" y2="370" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><rect x="505" y="290" width="180" height="64" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="595.0" y="315.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">/leave</text><text x="595.0" y="338.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">user ends the chat</text><rect x="505" y="396" width="180" height="64" rx="14" fill="#161b22" stroke="#f85149" stroke-width="2"/><text x="595.0" y="421.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Disconnect</text><text x="595.0" y="444.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">connection drops</text><path d="M457,370 H480 V322 H502" fill="none" stroke="#f0883e" stroke-width="2.5" marker-end="url(#m-orange)"/><path d="M457,370 H480 V428 H502" fill="none" stroke="#f85149" stroke-width="2.5" marker-end="url(#m-red)"/><rect x="735" y="396" width="180" height="64" rx="14" fill="#161b22" stroke="#e3b341" stroke-width="2"/><text x="825.0" y="421.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Reconnect grace</text><text x="825.0" y="444.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">short configurable window</text><line x1="688" y1="428" x2="732" y2="428" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><rect x="965" y="320" width="180" height="120" rx="14" fill="#161b22" stroke="#f85149" stroke-width="2"/><text x="1055.0" y="364.8" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Room terminated</text><text x="1055.0" y="387.8" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">either user left</text><text x="1055.0" y="404.8" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">or grace expired</text><line x1="688" y1="335" x2="962" y2="335" stroke="#f0883e" stroke-width="2.5" marker-end="url(#m-orange)"/><line x1="918" y1="428" x2="962" y2="428" stroke="#e3b341" stroke-width="2.5" marker-end="url(#m-yellow)"/><path d="M1055,442 V492 H595 V537" fill="none" stroke="#f85149" stroke-width="2.5" marker-end="url(#m-red)"/><rect x="505" y="540" width="180" height="80" rx="14" fill="#161b22" stroke="#f85149" stroke-width="2"/><text x="595.0" y="573.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Room key destroyed</text><text x="595.0" y="596.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">gone from memory</text><rect x="735" y="540" width="180" height="80" rx="14" fill="#161b22" stroke="#2dd4bf" stroke-width="2"/><text x="825.0" y="573.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">No chat history</text><text x="825.0" y="596.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">nothing was stored</text><line x1="688" y1="580" x2="732" y2="580" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><rect x="45" y="540" width="410" height="80" rx="14" fill="#161b22" stroke="#a371f7" stroke-width="2"/><text x="250.0" y="564.8" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Server-side enforcement</text><text x="250.0" y="587.8" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">Two users per room, one active room per user</text><text x="250.0" y="604.8" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">Rules live on the server, not only in the CLI</text></svg>