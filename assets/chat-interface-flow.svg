chor="middle">Conversations never touch the main dashboard</text><rect x="45" y="110" width="180" height="96" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="135.0" y="151.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Main CLI dashboard</text><text x="135.0" y="174.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">menu and status</text><circle cx="45" cy="110" r="13" fill="#58a6ff"/><text x="45" y="115" font-size="13" fill="#0d1117" font-weight="800" text-anchor="middle">1</text><rect x="275" y="110" width="180" height="96" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="365.0" y="151.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Notifications</text><text x="365.0" y="174.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">invitations arrive here</text><circle cx="275" cy="110" r="13" fill="#f0883e"/><text x="275" y="115" font-size="13" fill="#0d1117" font-weight="800" text-anchor="middle">2</text><rect x="505" y="110" width="180" height="96" rx="14" fill="#161b22" stroke="#a371f7" stroke-width="2"/><text x="595.0" y="151.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Private room</text><text x="595.0" y="174.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">two users only</text><circle cx="505" cy="110" r="13" fill="#a371f7"/><text x="505" y="115" font-size="13" fill="#0d1117" font-weight="800" text-anchor="middle">3</text><rect x="735" y="110" width="180" height="96" rx="14" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="825.0" y="151.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Chat window</text><text x="825.0" y="174.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">dedicated: send, /leave</text><circle cx="735" cy="110" r="13" fill="#3fb950"/><text x="735" y="115" font-size="13" fill="#0d1117" font-weight="800" text-anchor="middle">4</text><rect x="965" y="110" width="180" height="96" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="1055.0" y="151.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Back to dashboard</text><text x="1055.0" y="174.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">no message replay</text><circle cx="965" cy="110" r="13" fill="#58a6ff"/><text x="965" y="115" font-size="13" fill="#0d1117" font-weight="800" text-anchor="middle">5</text><line x1="228" y1="158.0" x2="272" y2="158.0" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><line x1="458" y1="158.0" x2="502" y2="158.0" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><line x1="688" y1="158.0" x2="732" y2="158.0" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><line x1="918" y1="158.0" x2="962" y2="158.0" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><text x="45" y="262" font-size="12" fill="#3fb950" font-weight="700" text-anchor="start">CORRECT DISPLAY</text><rect x="45" y="278" width="540" height="170" rx="14" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="315.0" y="367.8" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle"></text><text x="75" y="328" font-size="20" fill="#58a6ff" font-weight="400" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">user1: hii</text><text x="75" y="366" font-size="20" fill="#f778ba" font-weight="400" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">user2: hello</text><text x="75" y="404" font-size="20" fill="#58a6ff" font-weight="400" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace">user1: how are you?</text><text x="615" y="262" font-size="12" fill="#f85149" font-weight="700" text-anchor="start">INCORRECT DISPLAY (FIXED)</text><rect x="615" y="278" width="540" height="170" rx="14" fill="#161b22" stroke="#f85149" stroke-width="2"/><text x="885.0" y="367.8" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle"></text><text x="645" y="328" font-size="20" fill="#f85149" font-weight="400" text-anchor="start" font-family="Consolas, Menlo, 'Courier New', monospace" text-decoration="line-through">user2: user1: hii</text><text x="645" y="372" font-size="14" fill="#8b949e" font-weight="400" text-anchor="start">The receiver's name is never added to</text><text x="645" y="394" font-size="14" fill="#8b949e" font-weight="400" text-anchor="start">another user's message.</text><text x="600" y="495" font-size="14" fill="#2dd4bf" font-weight="400" text-anchor="middle">After /leave, private messages are not replayed or printed on the main dashboard.</text></svg>