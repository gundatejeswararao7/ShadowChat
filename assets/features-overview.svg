<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" width="1200" height="510" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a371f7"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f0883e"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f85149"/></marker><marker id="m-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/></marker><marker id="m-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f778ba"/></marker><marker id="m-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e3b341"/></marker><marker id="m-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs><rect width="1200" height="510" rx="20" fill="#0d1117" stroke="#30363d"/><text x="600.0" y="46" font-size="26" fill="#e6edf3" font-weight="800" text-anchor="middle">Key Features</text><text x="600.0" y="72" font-size="14" fill="#8b949e" font-weight="400" text-anchor="middle">Everything ShadowChat does, at a glance</text><rect x="45" y="100" width="350" height="110" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="220.0" y="140.4" font-size="18" fill="#e6edf3" font-weight="700" text-anchor="middle">Email OTP verification</text><text x="220.0" y="163.4" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">Six-digit code, SHA-256 hashed</text><text x="220.0" y="180.4" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">single-use, rate limited</text><circle cx="45" cy="100" r="13" fill="#58a6ff"/><text x="45" y="105" font-size="13" fill="#0d1117" font-weight="800" text-anchor="middle">1</text><rect x="425" y="100" width="350" height="110" rx="14" fill="#161b22" stroke="#a371f7" stroke-width="2"/><text x="600.0" y="140.4" font-size="18" fill="#e6edf3" font-weight="700" text-anchor="middle">Argon2id passwords</text><text x="600.0" y="163.4" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">Plaintext is never stored</text><text x="600.0" y="180.4" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">memory-hard hashing</text><circle cx="425" cy="100" r="13" fill="#a371f7"/><text x="425" y="105" font-size="13" fill="#0d1117" font-weight="800" text-anchor="middle">2</text><rect x="805" y="100" width="350" height="110" rx="14" fill="#161b22" stroke="#2dd4bf" stroke-width="2"/><text x="980.0" y="140.4" font-size="18" fill="#e6edf3" font-weight="700" text-anchor="middle">User ID search</text><text x="980.0" y="163.4" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">Find another user by User ID</text><text x="980.0" y="180.4" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">then send an invitation</text><circle cx="805" cy="100" r="13" fill="#2dd4bf"/><text x="805" y="105" font-size="13" fill="#0d1117" font-weight="800" text-anchor="middle">3</text><rect x="45" y="230" width="350" height="110" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="220.0" y="270.4" font-size="18" fill="#e6edf3" font-weight="700" text-anchor="middle">Private invitations</text><text x="220.0" y="293.4" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">Email + CLI notification</text><text x="220.0" y="310.4" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">YES / NO or auto-expiry</text><circle cx="45" cy="230" r="13" fill="#f0883e"/><text x="45" y="235" font-size="13" fill="#0d1117" font-weight="800" text-anchor="middle">4</text><rect x="425" y="230" width="350" height="110" rx="14" fill="#161b22" stroke="#f778ba" stroke-width="2"/><text x="600.0" y="270.4" font-size="18" fill="#e6edf3" font-weight="700" text-anchor="middle">Two-person rooms</text><text x="600.0" y="293.4" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">Exactly two participants</text><text x="600.0" y="310.4" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">one active room per user</text><circle cx="425" cy="230" r="13" fill="#f778ba"/><text x="425" y="235" font-size="13" fill="#0d1117" font-weight="800" text-anchor="middle">5</text><rect x="805" y="230" width="350" height="110" rx="14" fill="#161b22" stroke="#f85149" stroke-width="2"/><text x="980.0" y="270.4" font-size="18" fill="#e6edf3" font-weight="700" text-anchor="middle">AES-256-GCM chat</text><text x="980.0" y="293.4" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">Client-side encryption</text><text x="980.0" y="310.4" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">fresh 256-bit key per room</text><circle cx="805" cy="230" r="13" fill="#f85149"/><text x="805" y="235" font-size="13" fill="#0d1117" font-weight="800" text-anchor="middle">6</text><rect x="45" y="360" width="350" height="110" rx="14" fill="#161b22" stroke="#e3b341" stroke-width="2"/><text x="220.0" y="400.4" font-size="18" fill="#e6edf3" font-weight="700" text-anchor="middle">Fresh nonce per message</text><text x="220.0" y="423.4" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">Random 96-bit nonce</text><text x="220.0" y="440.4" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">never reused with a room key</text><circle cx="45" cy="360" r="13" fill="#e3b341"/><text x="45" y="365" font-size="13" fill="#0d1117" font-weight="800" text-anchor="middle">7</text><rect x="425" y="360" width="350" height="110" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="600.0" y="400.4" font-size="18" fill="#e6edf3" font-weight="700" text-anchor="middle">Dedicated chat window</text><text x="600.0" y="423.4" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">Separate from the dashboard</text><text x="600.0" y="440.4" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">no replay after /leave</text><circle cx="425" cy="360" r="13" fill="#58a6ff"/><text x="425" y="365" font-size="13" fill="#0d1117" font-weight="800" text-anchor="middle">8</text><rect x="805" y="360" width="350" height="110" rx="14" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="980.0" y="400.4" font-size="18" fill="#e6edf3" font-weight="700" text-anchor="middle">Automatic cleanup</text><text x="980.0" y="423.4" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">Room and key destroyed</text><text x="980.0" y="440.4" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">no permanent history</text><circle cx="805" cy="360" r="13" fill="#3fb950"/><text x="805" y="365" font-size="13" fill="#0d1117" font-weight="800" text-anchor="middle">9</text></svg>