<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a371f7"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f0883e"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f85149"/></marker><marker id="m-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/></marker><marker id="m-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f778ba"/></marker><marker id="m-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e3b341"/></marker><marker id="m-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs><rect width="1200" height="680" rx="20" fill="#0d1117" stroke="#30363d"/><text x="600.0" y="46" font-size="26" fill="#e6edf3" font-weight="800" text-anchor="middle">System Architecture</text><text x="600.0" y="72" font-size="14" fill="#8b949e" font-weight="400" text-anchor="middle">Python CLI client, FastAPI server, SQLite plus in-memory runtime state, Gmail SMTP</text><rect x="440" y="100" width="320" height="90" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="600.0" y="138.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">User / CLI</text><text x="600.0" y="161.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">Python  Typer  Rich</text><line x1="540" y1="192" x2="540" y2="268" stroke="#2dd4bf" stroke-width="2.5" marker-start="url(#m-teal)" marker-end="url(#m-teal)"/><line x1="660" y1="192" x2="660" y2="268" stroke="#a371f7" stroke-width="2.5" marker-start="url(#m-purple)" marker-end="url(#m-purple)"/><text x="528" y="236" font-size="13" fill="#2dd4bf" font-weight="600" text-anchor="end">REST / HTTP</text><text x="672" y="236" font-size="13" fill="#a371f7" font-weight="600" text-anchor="start">WebSocket</text><rect x="400" y="270" width="400" height="130" rx="14" fill="#161b22" stroke="#a371f7" stroke-width="2"/><text x="600.0" y="319.8" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">FastAPI Server</text><text x="600.0" y="342.8" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">REST API  |  WebSocket hub</text><text x="600.0" y="359.8" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">Authentication  |  Room management</text><rect x="900" y="285" width="250" height="100" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="1025.0" y="319.8" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Gmail SMTP</text><text x="1025.0" y="342.8" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">OTP emails</text><text x="1025.0" y="359.8" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">Invitation notifications</text><line x1="802" y1="335" x2="898" y2="335" stroke="#f0883e" stroke-width="2.5" marker-end="url(#m-orange)"/><text x="850" y="326" font-size="12" fill="#f0883e" font-weight="600" text-anchor="middle">SMTP</text><rect x="110" y="490" width="350" height="130" rx="14" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="285.0" y="539.8" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">SQLite + SQLAlchemy</text><text x="285.0" y="562.8" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">Users  |  OTP records</text><text x="285.0" y="579.8" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">Invitations  |  Rooms</text><rect x="740" y="490" width="350" height="130" rx="14" fill="#161b22" stroke="#f85149" stroke-width="2"/><text x="915.0" y="539.8" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">In-memory runtime state</text><text x="915.0" y="562.8" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">Sessions  |  Connections</text><text x="915.0" y="579.8" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">Active rooms  |  Room keys</text><path d="M500,402 V445 H285 V488" fill="none" stroke="#3fb950" stroke-width="2.5" marker-end="url(#m-green)"/><path d="M700,402 V445 H915 V488" fill="none" stroke="#f85149" stroke-width="2.5" marker-end="url(#m-red)"/><text x="285" y="650" font-size="12" fill="#8b949e" font-weight="400" text-anchor="middle">persistent data, never chat messages</text><text x="915" y="650" font-size="12" fill="#8b949e" font-weight="400" text-anchor="middle">volatile: cleared when the server restarts</text></svg>