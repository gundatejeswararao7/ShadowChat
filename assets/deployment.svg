<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a371f7"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f0883e"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f85149"/></marker><marker id="m-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/></marker><marker id="m-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f778ba"/></marker><marker id="m-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e3b341"/></marker><marker id="m-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs><rect width="1200" height="540" rx="20" fill="#0d1117" stroke="#30363d"/><text x="600.0" y="46" font-size="26" fill="#e6edf3" font-weight="800" text-anchor="middle">Production Deployment</text><text x="600.0" y="72" font-size="14" fill="#8b949e" font-weight="400" text-anchor="middle">HTTPS and WSS in front of the FastAPI server</text><rect x="40" y="130" width="180" height="96" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="130.0" y="171.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Internet</text><text x="130.0" y="194.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">clients</text><line x1="223" y1="178" x2="267" y2="178" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><rect x="270" y="130" width="180" height="96" rx="14" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="360.0" y="171.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">HTTPS / WSS</text><text x="360.0" y="194.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">TLS encrypted</text><line x1="453" y1="178" x2="497" y2="178" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><rect x="500" y="130" width="180" height="96" rx="14" fill="#161b22" stroke="#a371f7" stroke-width="2"/><text x="590.0" y="171.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Reverse proxy</text><text x="590.0" y="194.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">nginx / Caddy</text><line x1="683" y1="178" x2="727" y2="178" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><rect x="730" y="130" width="180" height="96" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="820.0" y="171.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">FastAPI server</text><text x="820.0" y="194.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">REST + WebSocket</text><rect x="970" y="95" width="190" height="76" rx="14" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="1065.0" y="126.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">SQLite</text><text x="1065.0" y="149.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">users, OTPs, rooms</text><rect x="970" y="205" width="190" height="76" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="1065.0" y="236.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Gmail SMTP</text><text x="1065.0" y="259.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">OTP + invitation mail</text><path d="M912,178 H940 V133 H966" fill="none" stroke="#3fb950" stroke-width="2.5" marker-end="url(#m-green)"/><path d="M912,178 H940 V243 H966" fill="none" stroke="#f0883e" stroke-width="2.5" marker-end="url(#m-orange)"/><text x="50" y="336" font-size="12" fill="#f85149" font-weight="700" text-anchor="start">PRODUCTION SECURITY REQUIREMENTS</text><rect x="50" y="352" width="260" height="44" rx="10" fill="#161b22" stroke="#30363d"/><circle cx="70" cy="374.0" r="5" fill="#f85149"/><text x="86" y="379.0" font-size="12" fill="#e6edf3" font-weight="400" text-anchor="start">Use HTTPS</text><rect x="330" y="352" width="260" height="44" rx="10" fill="#161b22" stroke="#30363d"/><circle cx="350" cy="374.0" r="5" fill="#f85149"/><text x="366" y="379.0" font-size="12" fill="#e6edf3" font-weight="400" text-anchor="start">Use WSS for WebSockets</text><rect x="610" y="352" width="260" height="44" rx="10" fill="#161b22" stroke="#30363d"/><circle cx="630" cy="374.0" r="5" fill="#f85149"/><text x="646" y="379.0" font-size="12" fill="#e6edf3" font-weight="400" text-anchor="start">Secrets as environment variables</text><rect x="890" y="352" width="260" height="44" rx="10" fill="#161b22" stroke="#30363d"/><circle cx="910" cy="374.0" r="5" fill="#f85149"/><text x="926" y="379.0" font-size="12" fill="#e6edf3" font-weight="400" text-anchor="start">Never expose .env</text><rect x="50" y="406" width="260" height="44" rx="10" fill="#161b22" stroke="#30363d"/><circle cx="70" cy="428.0" r="5" fill="#f85149"/><text x="86" y="433.0" font-size="12" fill="#e6edf3" font-weight="400" text-anchor="start">Never expose Gmail App Passwords</text><rect x="330" y="406" width="260" height="44" rx="10" fill="#161b22" stroke="#30363d"/><circle cx="350" cy="428.0" r="5" fill="#f85149"/><text x="366" y="433.0" font-size="12" fill="#e6edf3" font-weight="400" text-anchor="start">Server / network access controls</text><rect x="610" y="406" width="260" height="44" rx="10" fill="#161b22" stroke="#30363d"/><circle cx="630" cy="428.0" r="5" fill="#f85149"/><text x="646" y="433.0" font-size="12" fill="#e6edf3" font-weight="400" text-anchor="start">Monitor health and failures</text><rect x="50" y="470" width="1100" height="42" rx="21.0" fill="#e3b341" fill-opacity="0.14" stroke="#e3b341"/><text x="600.0" y="495.9" font-size="14" fill="#e3b341" font-weight="600" text-anchor="middle">AES protects message content, but it does not make a connection anonymous or untraceable.</text></svg>