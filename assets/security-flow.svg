<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a371f7"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f0883e"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f85149"/></marker><marker id="m-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/></marker><marker id="m-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f778ba"/></marker><marker id="m-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e3b341"/></marker><marker id="m-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs><rect width="1200" height="540" rx="20" fill="#0d1117" stroke="#30363d"/><text x="600.0" y="46" font-size="26" fill="#e6edf3" font-weight="800" text-anchor="middle">Security Flow</text><text x="600.0" y="72" font-size="14" fill="#8b949e" font-weight="400" text-anchor="middle">From a typed password to encrypted messages</text><text x="165" y="98" font-size="12" fill="#58a6ff" font-weight="700" text-anchor="start">1  AUTHENTICATE</text><text x="165" y="318" font-size="12" fill="#f85149" font-weight="700" text-anchor="start">2  PROTECT MESSAGES</text><rect x="45" y="112" width="180" height="84" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="135.0" y="147.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">User password</text><text x="135.0" y="170.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">typed in the CLI</text><rect x="275" y="112" width="180" height="84" rx="14" fill="#161b22" stroke="#a371f7" stroke-width="2"/><text x="365.0" y="147.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Argon2id</text><text x="365.0" y="170.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">memory-hard hash</text><rect x="505" y="112" width="180" height="84" rx="14" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="595.0" y="147.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Password hash</text><text x="595.0" y="170.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">stored in SQLite</text><rect x="735" y="112" width="180" height="84" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="825.0" y="147.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Login</text><text x="825.0" y="170.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">hash is verified</text><rect x="965" y="112" width="180" height="84" rx="14" fill="#161b22" stroke="#e3b341" stroke-width="2"/><text x="1055.0" y="147.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Session token</text><text x="1055.0" y="170.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">server-side, runtime</text><line x1="228" y1="154.0" x2="272" y2="154.0" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><line x1="458" y1="154.0" x2="502" y2="154.0" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><line x1="688" y1="154.0" x2="732" y2="154.0" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><line x1="918" y1="154.0" x2="962" y2="154.0" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><path d="M1055.0,196 V264 H135.0 V329" fill="none" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><rect x="45" y="332" width="180" height="84" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="135.0" y="367.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Authenticated WS</text><text x="135.0" y="390.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">token required</text><rect x="275" y="332" width="180" height="84" rx="14" fill="#161b22" stroke="#e3b341" stroke-width="2"/><text x="365.0" y="367.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Temporary room key</text><text x="365.0" y="390.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">fresh per room</text><rect x="505" y="332" width="180" height="84" rx="14" fill="#161b22" stroke="#a371f7" stroke-width="2"/><text x="595.0" y="367.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">AES-256-GCM</text><text x="595.0" y="390.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">encrypts each message</text><rect x="735" y="332" width="180" height="84" rx="14" fill="#161b22" stroke="#f85149" stroke-width="2"/><text x="825.0" y="367.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Encrypted messages</text><text x="825.0" y="390.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">ciphertext + nonce</text><rect x="965" y="332" width="180" height="84" rx="14" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="1055.0" y="367.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Key destroyed</text><text x="1055.0" y="390.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">when the room ends</text><line x1="228" y1="374.0" x2="272" y2="374.0" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><line x1="458" y1="374.0" x2="502" y2="374.0" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><line x1="688" y1="374.0" x2="732" y2="374.0" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><line x1="918" y1="374.0" x2="962" y2="374.0" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><rect x="45" y="460" width="1110" height="44" rx="22.0" fill="#2dd4bf" fill-opacity="0.14" stroke="#2dd4bf"/><text x="600.0" y="487.25" font-size="15" fill="#2dd4bf" font-weight="600" text-anchor="middle">Plaintext passwords are never stored   |   OTPs are never printed   |   Chat history is never kept</text></svg>