ont-weight="700" text-anchor="middle">Create credentials</text><text x="825.0" y="183.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">User ID + password</text><circle cx="735" cy="125" r="13" fill="#58a6ff"/><text x="735" y="130" font-size="13" fill="#0d1117" font-weight="800" text-anchor="middle">4</text><rect x="965" y="125" width="180" height="84" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="1055.0" y="160.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Login</text><text x="1055.0" y="183.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">Argon2id check</text><circle cx="965" cy="125" r="13" fill="#58a6ff"/><text x="965" y="130" font-size="13" fill="#0d1117" font-weight="800" text-anchor="middle">5</text><line x1="228" y1="167.0" x2="272" y2="167.0" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><line x1="458" y1="167.0" x2="502" y2="167.0" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><line x1="688" y1="167.0" x2="732" y2="167.0" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><line x1="918" y1="167.0" x2="962" y2="167.0" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><path d="M1055.0,209 V277 H135.0 V342" fill="none" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><rect x="45" y="345" width="180" height="84" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="135.0" y="380.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Search User ID</text><text x="135.0" y="403.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">find another user</text><circle cx="45" cy="345" r="13" fill="#f0883e"/><text x="45" y="350" font-size="13" fill="#0d1117" font-weight="800" text-anchor="middle">6</text><rect x="275" y="345" width="180" height="84" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="365.0" y="380.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Send invitation</text><text x="365.0" y="403.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">private chat request</text><circle cx="275" cy="345" r="13" fill="#f0883e"/><text x="275" y="350" font-size="13" fill="#0d1117" font-weight="800" text-anchor="middle">7</text><rect x="505" y="345" width="180" height="84" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="595.0" y="380.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Recipient notified</text><text x="595.0" y="403.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">email + CLI alert</text><circle cx="505" cy="345" r="13" fill="#f0883e"/><text x="505" y="350" font-size="13" fill="#0d1117" font-weight="800" text-anchor="middle">8</text><rect x="735" y="345" width="180" height="84" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="825.0" y="380.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Accepted?</text><text x="825.0" y="403.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">YES / NO / expires</text><circle cx="735" cy="345" r="13" fill="#f0883e"/><text x="735" y="350" font-size="13" fill="#0d1117" font-weight="800" text-anchor="middle">9</text><rect x="965" y="345" width="180" height="84" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="1055.0" y="380.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Private room</text><text x="1055.0" y="403.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">exactly two users</text><circle cx="965" cy="345" r="13" fill="#f0883e"/><text x="965" y="350" font-size="13" fill="#0d1117" font-weight="800" text-anchor="middle">10</text><line x1="228" y1="387.0" x2="272" y2="387.0" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><line x1="458" y1="387.0" x2="502" y2="387.0" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><line x1="688" y1="387.0" x2="732" y2="387.0" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><line x1="918" y1="387.0" x2="962" y2="387.0" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><rect x="755" y="437" width="140" height="24" rx="12.0" fill="#f85149" fill-opacity="0.14" stroke="#f85149"/><text x="825.0" y="453.55" font-size="13" fill="#f85149" font-weight="600" text-anchor="middle">NO: rejected</text><path d="M1055.0,429 V500 H135.0 V562" fill="none" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><rect x="45" y="565" width="180" height="84" rx="14" fill="#161b22" stroke="#e3b341" stroke-width="2"/><text x="135.0" y="600.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Fresh AES key</text><text x="135.0" y="623.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">256-bit per room</text><circle cx="45" cy="565" r="13" fill="#e3b341"/><text x="45" y="570" font-size="13" fill="#0d1117" font-weight="800" text-anchor="middle">11</text><rect x="275" y="565" width="180" height="84" rx="14" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="365.0" y="600.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Encrypted chat</text><text x="365.0" y="623.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">client-side AES-256-GCM</text><circle cx="275" cy="565" r="13" fill="#3fb950"/><text x="275" y="570" font-size="13" fill="#0d1117" font-weight="800" text-anchor="middle">12</text><rect x="505" y="565" width="180" height="84" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="595.0" y="600.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">/leave or timeout</text><text x="595.0" y="623.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">either user ends it</text><circle cx="505" cy="565" r="13" fill="#f0883e"/><text x="505" y="570" font-size="13" fill="#0d1117" font-weight="800" text-anchor="middle">13</text><rect x="735" y="565" width="180" height="84" rx="14" fill="#161b22" stroke="#f85149" stroke-width="2"/><text x="825.0" y="600.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Room cleanup</text><text x="825.0" y="623.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">key destroyed</text><circle cx="735" cy="565" r="13" fill="#f85149"/><text x="735" y="570" font-size="13" fill="#0d1117" font-weight="800" text-anchor="middle">14</text><rect x="965" y="565" width="180" height="84" rx="14" fill="#161b22" stroke="#2dd4bf" stroke-width="2"/><text x="1055.0" y="600.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">No chat history</text><text x="1055.0" y="623.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">nothing is stored</text><circle cx="965" cy="565" r="13" fill="#2dd4bf"/><text x="965" y="570" font-size="13" fill="#0d1117" font-weight="800" text-anchor="middle">15</text><line x1="228" y1="607.0" x2="272" y2="607.0" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><line x1="458" y1="607.0" x2="502" y2="607.0" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><line x1="688" y1="607.0" x2="732" y2="607.0" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><line x1="918" y1="607.0" x2="962" y2="607.0" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/></svg>