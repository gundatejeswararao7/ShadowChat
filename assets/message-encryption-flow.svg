<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a371f7"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f0883e"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f85149"/></marker><marker id="m-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/></marker><marker id="m-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f778ba"/></marker><marker id="m-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e3b341"/></marker><marker id="m-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs><rect width="1200" height="640" rx="20" fill="#0d1117" stroke="#30363d"/><text x="600.0" y="46" font-size="26" fill="#e6edf3" font-weight="800" text-anchor="middle">Message Data Flow</text><text x="600.0" y="72" font-size="14" fill="#8b949e" font-weight="400" text-anchor="middle">The server relays ciphertext and never needs the plaintext</text><rect x="12" y="100" width="328" height="200" rx="14" fill="#a371f7" fill-opacity="0.07" stroke="#a371f7" stroke-dasharray="6 4"/><text x="176.0" y="124" font-size="12" fill="#a371f7" font-weight="700" text-anchor="middle">PLAINTEXT: sender device</text><rect x="356" y="100" width="500" height="200" rx="14" fill="#f85149" fill-opacity="0.07" stroke="#f85149" stroke-dasharray="6 4"/><text x="606.0" y="124" font-size="12" fill="#f85149" font-weight="700" text-anchor="middle">CIPHERTEXT ONLY: network and server</text><rect x="872" y="100" width="316" height="200" rx="14" fill="#2dd4bf" fill-opacity="0.07" stroke="#2dd4bf" stroke-dasharray="6 4"/><text x="1030.0" y="124" font-size="12" fill="#2dd4bf" font-weight="700" text-anchor="middle">PLAINTEXT: receiver device</text><rect x="30" y="170" width="130" height="100" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="95.0" y="204.5" font-size="15" fill="#e6edf3" font-weight="700" text-anchor="middle">User 1</text><text x="95.0" y="227.5" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">types a</text><text x="95.0" y="244.5" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">message</text><line x1="163" y1="220" x2="197" y2="220" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><rect x="200" y="170" width="130" height="100" rx="14" fill="#161b22" stroke="#a371f7" stroke-width="2"/><text x="265.0" y="204.5" font-size="15" fill="#e6edf3" font-weight="700" text-anchor="middle">Client</text><text x="265.0" y="227.5" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">encrypts with</text><text x="265.0" y="244.5" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">AES-256-GCM</text><line x1="333" y1="220" x2="367" y2="220" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><rect x="370" y="170" width="130" height="100" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="435.0" y="204.5" font-size="15" fill="#e6edf3" font-weight="700" text-anchor="middle">WebSocket</text><text x="435.0" y="227.5" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">ciphertext</text><text x="435.0" y="244.5" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">+ nonce</text><line x1="503" y1="220" x2="537" y2="220" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><rect x="540" y="170" width="130" height="100" rx="14" fill="#161b22" stroke="#f85149" stroke-width="2"/><text x="605.0" y="204.5" font-size="15" fill="#e6edf3" font-weight="700" text-anchor="middle">FastAPI relay</text><text x="605.0" y="227.5" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">relays only</text><text x="605.0" y="244.5" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">ciphertext</text><line x1="673" y1="220" x2="707" y2="220" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><rect x="710" y="170" width="130" height="100" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="775.0" y="204.5" font-size="15" fill="#e6edf3" font-weight="700" text-anchor="middle">WebSocket</text><text x="775.0" y="227.5" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">ciphertext</text><text x="775.0" y="244.5" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">+ nonce</text><line x1="843" y1="220" x2="877" y2="220" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><rect x="880" y="170" width="130" height="100" rx="14" fill="#161b22" stroke="#a371f7" stroke-width="2"/><text x="945.0" y="204.5" font-size="15" fill="#e6edf3" font-weight="700" text-anchor="middle">Client</text><text x="945.0" y="227.5" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">decrypts with</text><text x="945.0" y="244.5" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">AES-256-GCM</text><line x1="1013" y1="220" x2="1047" y2="220" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><rect x="1050" y="170" width="130" height="100" rx="14" fill="#161b22" stroke="#f778ba" stroke-width="2"/><text x="1115.0" y="204.5" font-size="15" fill="#e6edf3" font-weight="700" text-anchor="middle">User 2</text><text x="1115.0" y="227.5" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">reads</text><text x="1115.0" y="244.5" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">plaintext</text><text x="45" y="350" font-size="12" fill="#e3b341" font-weight="700" text-anchor="start">FRESH NONCE PER MESSAGE</text><rect x="45" y="365" width="520" height="235" rx="14" fill="#161b22" stroke="#e3b341" stroke-width="2"/><text x="305.0" y="487.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle"></text><rect x="65" y="385" width="480" height="44" rx="10" fill="#e3b341" fill-opacity="0.12" stroke="#e3b341"/><text x="305" y="413" font-size="15" fill="#e6edf3" font-weight="700" text-anchor="middle">Room key: fresh random 256-bit key per room</text><rect x="65" y="450" width="230" height="40" rx="10" fill="#161b22" stroke="#30363d"/><circle cx="85" cy="470.0" r="5" fill="#e3b341"/><text x="101" y="475.0" font-size="14" fill="#e6edf3" font-weight="400" text-anchor="start">Message 1  &gt;  Nonce 1</text><rect x="315" y="450" width="230" height="40" rx="10" fill="#161b22" stroke="#30363d"/><circle cx="335" cy="470.0" r="5" fill="#e3b341"/><text x="351" y="475.0" font-size="14" fill="#e6edf3" font-weight="400" text-anchor="start">Message 2  &gt;  Nonce 2</text><rect x="65" y="502" width="230" height="40" rx="10" fill="#161b22" stroke="#30363d"/><circle cx="85" cy="522.0" r="5" fill="#e3b341"/><text x="101" y="527.0" font-size="14" fill="#e6edf3" font-weight="400" text-anchor="start">Message 3  &gt;  Nonce 3</text><rect x="315" y="502" width="230" height="40" rx="10" fill="#161b22" stroke="#30363d"/><circle cx="335" cy="522.0" r="5" fill="#e3b341"/><text x="351" y="527.0" font-size="14" fill="#e6edf3" font-weight="400" text-anchor="start">Message 4  &gt;  Nonce 4</text><text x="305" y="568" font-size="12" fill="#8b949e" font-weight="400" text-anchor="middle">Fresh random 96-bit nonce, never reused with the same room key</text><text x="605" y="350" font-size="12" fill="#f85149" font-weight="700" text-anchor="start">AES-256-GCM PROVIDES</text><rect x="605" y="365" width="550" height="235" rx="14" fill="#161b22" stroke="#f85149" stroke-width="2"/><text x="880.0" y="487.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle"></text><rect x="625" y="385" width="510" height="52" rx="10" fill="#161b22" stroke="#30363d"/><text x="645" y="408" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="start">Confidentiality</text><text x="645" y="427" font-size="13" fill="#8b949e" font-weight="400" text-anchor="start">only the two clients can read the message</text><rect x="625" y="449" width="510" height="52" rx="10" fill="#161b22" stroke="#30363d"/><text x="645" y="472" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="start">Integrity</text><text x="645" y="491" font-size="13" fill="#8b949e" font-weight="400" text-anchor="start">any tampering is detected</text><rect x="625" y="513" width="510" height="52" rx="10" fill="#161b22" stroke="#30363d"/><text x="645" y="536" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="start">Authentication of data</text><text x="645" y="555" font-size="13" fill="#8b949e" font-weight="400" text-anchor="start">forged ciphertext is rejected</text></svg>