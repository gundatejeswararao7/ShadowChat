<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a371f7"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f0883e"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f85149"/></marker><marker id="m-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/></marker><marker id="m-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f778ba"/></marker><marker id="m-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e3b341"/></marker><marker id="m-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs><rect width="1200" height="560" rx="20" fill="#0d1117" stroke="#30363d"/><text x="600.0" y="46" font-size="26" fill="#e6edf3" font-weight="800" text-anchor="middle">Email OTP Verification</text><text x="600.0" y="72" font-size="14" fill="#8b949e" font-weight="400" text-anchor="middle">And how passwords are stored</text><rect x="45" y="100" width="160" height="96" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="125.0" y="141.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">User registration</text><text x="125.0" y="164.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">enters email</text><circle cx="45" cy="100" r="13" fill="#58a6ff"/><text x="45" y="105" font-size="13" fill="#0d1117" font-weight="800" text-anchor="middle">1</text><line x1="208" y1="148" x2="230" y2="148" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><rect x="233" y="100" width="160" height="96" rx="14" fill="#161b22" stroke="#a371f7" stroke-width="2"/><text x="313.0" y="141.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">6-digit OTP</text><text x="313.0" y="164.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">Python secrets</text><circle cx="233" cy="100" r="13" fill="#a371f7"/><text x="233" y="105" font-size="13" fill="#0d1117" font-weight="800" text-anchor="middle">2</text><line x1="396" y1="148" x2="418" y2="148" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><rect x="421" y="100" width="160" height="96" rx="14" fill="#161b22" stroke="#e3b341" stroke-width="2"/><text x="501.0" y="141.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">SHA-256 hash</text><text x="501.0" y="164.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">hash stored, not OTP</text><circle cx="421" cy="100" r="13" fill="#e3b341"/><text x="421" y="105" font-size="13" fill="#0d1117" font-weight="800" text-anchor="middle">3</text><line x1="584" y1="148" x2="606" y2="148" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><rect x="609" y="100" width="160" height="96" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="689.0" y="141.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Gmail SMTP</text><text x="689.0" y="164.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">OTP is emailed</text><circle cx="609" cy="100" r="13" fill="#f0883e"/><text x="609" y="105" font-size="13" fill="#0d1117" font-weight="800" text-anchor="middle">4</text><line x1="772" y1="148" x2="794" y2="148" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><rect x="797" y="100" width="160" height="96" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="877.0" y="141.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">User enters OTP</text><text x="877.0" y="164.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">attempts limited</text><circle cx="797" cy="100" r="13" fill="#58a6ff"/><text x="797" y="105" font-size="13" fill="#0d1117" font-weight="800" text-anchor="middle">5</text><line x1="960" y1="148" x2="982" y2="148" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><rect x="985" y="100" width="160" height="96" rx="14" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="1065.0" y="141.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Email verified</text><text x="1065.0" y="164.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">single-use</text><circle cx="985" cy="100" r="13" fill="#3fb950"/><text x="985" y="105" font-size="13" fill="#0d1117" font-weight="800" text-anchor="middle">6</text><text x="50" y="246" font-size="12" fill="#58a6ff" font-weight="700" text-anchor="start">SECURITY RULES</text><rect x="50" y="262" width="260" height="44" rx="10" fill="#161b22" stroke="#30363d"/><circle cx="70" cy="284.0" r="5" fill="#58a6ff"/><text x="86" y="289.0" font-size="12" fill="#e6edf3" font-weight="400" text-anchor="start">Six-digit OTP</text><rect x="330" y="262" width="260" height="44" rx="10" fill="#161b22" stroke="#30363d"/><circle cx="350" cy="284.0" r="5" fill="#58a6ff"/><text x="366" y="289.0" font-size="12" fill="#e6edf3" font-weight="400" text-anchor="start">Generated with Python secrets</text><rect x="610" y="262" width="260" height="44" rx="10" fill="#161b22" stroke="#30363d"/><circle cx="630" cy="284.0" r="5" fill="#58a6ff"/><text x="646" y="289.0" font-size="12" fill="#e6edf3" font-weight="400" text-anchor="start">SHA-256 hash, never plaintext</text><rect x="890" y="262" width="260" height="44" rx="10" fill="#161b22" stroke="#30363d"/><circle cx="910" cy="284.0" r="5" fill="#58a6ff"/><text x="926" y="289.0" font-size="12" fill="#e6edf3" font-weight="400" text-anchor="start">Configurable expiration</text><rect x="50" y="316" width="260" height="44" rx="10" fill="#161b22" stroke="#30363d"/><circle cx="70" cy="338.0" r="5" fill="#58a6ff"/><text x="86" y="343.0" font-size="12" fill="#e6edf3" font-weight="400" text-anchor="start">Attempt limiting</text><rect x="330" y="316" width="260" height="44" rx="10" fill="#161b22" stroke="#30363d"/><circle cx="350" cy="338.0" r="5" fill="#58a6ff"/><text x="366" y="343.0" font-size="12" fill="#e6edf3" font-weight="400" text-anchor="start">Resend cooldown</text><rect x="610" y="316" width="260" height="44" rx="10" fill="#161b22" stroke="#30363d"/><circle cx="630" cy="338.0" r="5" fill="#58a6ff"/><text x="646" y="343.0" font-size="12" fill="#e6edf3" font-weight="400" text-anchor="start">Single-use verification</text><rect x="890" y="316" width="260" height="44" rx="10" fill="#161b22" stroke="#30363d"/><circle cx="910" cy="338.0" r="5" fill="#58a6ff"/><text x="926" y="343.0" font-size="12" fill="#e6edf3" font-weight="400" text-anchor="start">Never printed or returned by the API</text><text x="50" y="398" font-size="12" fill="#a371f7" font-weight="700" text-anchor="start">PASSWORD STORAGE</text><rect x="70" y="415" width="220" height="72" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="180.0" y="444.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Password</text><text x="180.0" y="467.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">typed in the CLI</text><line x1="293" y1="451" x2="347" y2="451" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><rect x="350" y="415" width="220" height="72" rx="14" fill="#161b22" stroke="#a371f7" stroke-width="2"/><text x="460.0" y="444.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Argon2id</text><text x="460.0" y="467.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">memory-hard hash</text><line x1="573" y1="451" x2="627" y2="451" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><rect x="630" y="415" width="220" height="72" rx="14" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="740.0" y="444.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">Password hash</text><text x="740.0" y="467.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">the only thing kept</text><line x1="853" y1="451" x2="907" y2="451" stroke="#8b949e" stroke-width="2.5" marker-end="url(#m-grey)"/><rect x="910" y="415" width="220" height="72" rx="14" fill="#161b22" stroke="#2dd4bf" stroke-width="2"/><text x="1020.0" y="444.3" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="middle">SQLite database</text><text x="1020.0" y="467.3" font-size="13" fill="#8b949e" font-weight="400" text-anchor="middle">plaintext never stored</text></svg>